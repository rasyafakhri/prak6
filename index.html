<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Workshop</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">

        <h1 id="judul">
            Form Pendaftaran Workshop
        </h1>

        <form id="formWorkshop" novalidate>

            <label for="nama">
                Nama Lengkap
            </label>

            <input
                type="text"
                id="nama"
                placeholder="Masukkan nama lengkap">

            <p>
                Jumlah karakter:
                <span id="jumlahKarakter">0</span>
            </p>

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="contoh@email.com">

            <label for="sesi">
                Pilih Sesi Workshop
            </label>

            <select id="sesi">
                <option value="">
                    -- Pilih Sesi --
                </option>

                <option value="Web Development">
                    Web Development
                </option>

                <option value="UI/UX Design">
                    UI/UX Design
                </option>

                <option value="Cyber Security">
                    Cyber Security
                </option>

                <option value="Data Science">
                    Data Science
                </option>
            </select>

            <p id="infoSesi">
                Belum memilih sesi.
            </p>

            <div class="button-group">

                <button type="submit">
                    Daftar
                </button>

                <button
                    type="button"
                    id="btnReset">
                    Reset
                </button>

            </div>

        </form>

        <div id="hasilRingkasan"></div>

        <p id="pesan"></p>

    </div>

</body>
</html>
